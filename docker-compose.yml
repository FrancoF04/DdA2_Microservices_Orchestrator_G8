# Infraestructura local compartida por TODO el ecosistema (ver docs/04-desarrollo-local.md).
#
#   docker compose up -d                          # Postgres, Kafka y kafka-ui
#   docker compose --profile clientes-simulado up -d   # además, el simulador de clientes (opcional)
#   docker compose --profile orquestador up -d    # además, el orquestador en contenedor
#
# Los microservicios (leads, calificacion, vehiculos, etc.) se corren nativos desde
# su propio repo y se conectan por localhost:
#   Postgres  localhost:5432  (base `postgres`, un schema y un usuario por servicio)
#   Kafka     localhost:9092
#   kafka-ui  http://localhost:8090
#   clientes  http://localhost:8082  (el real, nativo desde ClientMicroservice; el simulador solo si no lo levantás)
#
# No levantar a la vez el docker-compose propio de LeadsMicroservice: usa los mismos puertos.
#
# Imágenes fijadas por tag y digest (versión con >= 3 días de publicada, ver CLAUDE.md).
name: crm-local

services:
  postgres:
    image: postgres:16.15-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      # Si ya tenés un Postgres en 5432: POSTGRES_PUERTO=5433 docker compose up -d
      - "${POSTGRES_PUERTO:-5432}:5432"
    volumes:
      - postgres_crm:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.4.0@sha256:833b867a9585a141da455dc2b57431c65cbccb27f11c91f694444cca9f777e0f
    environment:
      CLUSTER_ID: crm-local-cluster-000001
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # INTERNAL: para los contenedores (kafka:29092). EXTERNAL: para tu máquina (localhost:9092).
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # 3 particiones, igual que crean los servicios sus tópicos. Si un tópico se
      # autocrea con 1 (porque alguien lo escucha antes de que exista) y después un
      # servicio lo agranda, los consumidores ya conectados no ven las particiones
      # nuevas hasta ~5 min después y los mensajes quedan sin leer.
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "9092:9092"
    volumes:
      - kafka_crm:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0@sha256:7cda86a33344160309fdb65146332e4da65db81a945614f2fe32e210803f6fd1
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - "8090:8080"
    depends_on:
      kafka:
        condition: service_healthy

  # Opcional: sirve para probar leads o calificacion sin levantar el servicio real. No usarlo junto
  # con el real: los dos escuchan en el 8082.
  clientes-simulado:
    profiles: ["clientes-simulado"]
    build:
      context: .
      dockerfile: dev/clientes_simulado/Dockerfile
    image: clientes-simulado:local
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # Mismas claves que el perfil `local` del servicio real (ver docs/04), así leads y
      # calificacion no cambian su .env al pasar de uno al otro.
      CLIENTES_CLAVE_LEADS: solo-local-clave-de-servicio-leads-0001
      CLIENTES_CLAVE_CALIFICACION: solo-local-clave-de-servicio-calificacion-0001
    ports:
      - "8082:8082"
    depends_on:
      kafka:
        condition: service_healthy

  orquestador:
    profiles: ["orquestador"]
    build: .
    image: orquestador:local
    environment:
      DATABASE_URL: postgresql://orquestador:orquestador@postgres:5432/postgres
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # Desde el contenedor, los servicios nativos se alcanzan por host.docker.internal.
      LEADS_URL: http://host.docker.internal:8000
      CLIENTES_URL: http://host.docker.internal:8082
      VEHICULOS_URL: http://host.docker.internal:8083
      CALIFICACION_URL: http://host.docker.internal:8084
      MONITOR_URL: http://host.docker.internal:8085
      IA_RESUMEN_URL: http://host.docker.internal:8001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: on-failure:3

volumes:
  postgres_crm:
  kafka_crm:
