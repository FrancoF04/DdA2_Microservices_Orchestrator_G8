# Entorno de desarrollo local: orquestador + PostgreSQL + Kafka (KRaft).
#
#   docker compose up --build                       # orquestador, postgres y kafka
#   docker compose --profile herramientas up        # además, kafka-ui en :8090
#
# Este compose SIEMPRE usa la infraestructura local (pisa DATABASE_URL y Kafka
# del .env). Para correr contra Supabase y Aiven:
#   docker build -t orquestador:local . && docker run --env-file .env -p 8080:8080 orquestador:local
#
# Imágenes fijadas por tag y digest (versión con >= 3 días de publicada, ver CLAUDE.md).
name: orquestador

services:
  orquestador:
    build: .
    image: orquestador:local
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://orquestador:orquestador@postgres:5432/orquestador
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_SECURITY_PROTOCOL: ""
      KAFKA_SASL_MECHANISM: ""
      KAFKA_SASL_USERNAME: ""
      KAFKA_SASL_PASSWORD: ""
      KAFKA_SSL_CAFILE: ""
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: on-failure:3

  postgres:
    image: postgres:16.15-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    environment:
      POSTGRES_USER: orquestador
      POSTGRES_PASSWORD: orquestador
      POSTGRES_DB: orquestador
    ports:
      - "5433:5432"   # 5433 en el host para no chocar con otro Postgres local
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orquestador -d orquestador"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.4.0@sha256:833b867a9585a141da455dc2b57431c65cbccb27f11c91f694444cca9f777e0f
    environment:
      CLUSTER_ID: orquestador-local-cluster-0
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # INTERNAL: para los contenedores (kafka:29092). EXTERNAL: para el host (localhost:9092).
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0@sha256:7cda86a33344160309fdb65146332e4da65db81a945614f2fe32e210803f6fd1
    profiles: ["herramientas"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - "8090:8080"
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  postgres_data:
